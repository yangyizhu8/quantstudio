interface:
  display_name: "QuantStudio Strict Agent-first Strategy Engineering"
  short_description: "Strict R0-R6, explicit dual/local targets, PIT ETF routing"
  default_prompt: "Use $quantstudio-strategy-compiler. Execute R0-R6 strictly in order. At R0 first ask the customer to choose dual (QuantStudio + PTrade) or QuantStudio-only, and stop for explicit replies at R0 and R2.5. Route local data through providers and prefer project data/quantstudio.db. Dual ETF strategies use a confirmed static whitelist and forbid local-only APIs; QuantStudio-only ETF strategies may use get_etf_list_local/get_history_batch and must record PTrade/dual checks as NOT_APPLICABLE. Publish only applicable targets after their gates pass."
