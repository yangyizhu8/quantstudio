# =====================================================================
# PTrade 部署转换契约表（API 可用性矩阵）——qs-deploy 内核唯一 API 事实源
# 对应设计文档：docs/ptrade-deploy-pipeline-design.md §5.1（M3 种子条目集）
#
# schema（每条目 8 字段）：
#   signature    —— 函数签名（不确定处以 (...) 泛化，不伪造精度）
#   backtest     —— 回测环境可用
#   trading      —— 交易（模拟盘/实盘）环境可用
#   action       —— 变换动作：strip_or_gate(门控保留) | strip(剔除) | gate(门控)
#                   | keep(保持) | replace(替换) | reject(依赖即判不可转换)
#                   ※ reject 为 M3 在设计文档四值（strip|gate|keep|replace）基础上的
#                     显式扩展（P0 可转换性判定需表驱动，禁止代码内散落硬编码），
#                     偏差已在 runner 返回汇总中声明
#   replacement  —— replace 动作的替代表达式（种子集无 replace 条目）
#   pbox_version —— 可用性依赖的最低 PBOX 版本（"all"=无版本约束）
#   source       —— 文档出处（可溯源，设计文档 §1.2 F1-F10 查证链）
#   note         —— 备注
#
# 条目变更走框架层六步流水线（AGENTS.md 铁律）。
# =====================================================================
api:
  # ---------- 回测专用（backtest:true / trading:false）8 个 ----------
  set_commission:
    signature: "set_commission(commission_ratio=..., min_commission=..., type=...)"
    backtest: true
    trading: false
    action: strip_or_gate
    replacement: null
    pbox_version: "all"
    source: "Ptrade东莞.md-设置函数（设计文档 §1.2 F8）"
    note: "回测撮合费率参数；交易环境无撮合语义，以 is_trade() 门控保留（回测行为不变）"
  set_slippage:
    signature: "set_slippage(value)"
    backtest: true
    trading: false
    action: strip_or_gate
    replacement: null
    pbox_version: "all"
    source: "Ptrade东莞.md-设置函数（设计文档 §1.2 F8）"
    note: "回测滑点模型参数；交易环境由真实柜台盘口替代"
  set_fixed_slippage:
    signature: "set_fixed_slippage(fixedslippe)"
    backtest: true
    trading: false
    action: strip_or_gate
    replacement: null
    pbox_version: "all"
    source: "Ptrade东莞.md-设置函数（设计文档 §1.2 F8）"
    note: "回测固定滑点参数；同 set_slippage 门控保留"
  set_volume_ratio:
    signature: "set_volume_ratio(volume_ratio)"
    backtest: true
    trading: false
    action: strip_or_gate
    replacement: null
    pbox_version: "all"
    source: "Ptrade东莞.md-设置函数（设计文档 §1.2 F8）"
    note: "回测撮合量限制参数；门控保留"
  set_limit_mode:
    signature: "set_limit_mode(limit_mode)"
    backtest: true
    trading: false
    action: strip_or_gate
    replacement: null
    pbox_version: "all"
    source: "Ptrade东莞.md-设置函数（设计文档 §1.2 F8）"
    note: "回测涨跌停撮合模式参数；门控保留"
  set_yesterday_position:
    signature: "set_yesterday_position(filename)"
    backtest: true
    trading: false
    action: strip_or_gate
    replacement: null
    pbox_version: "all"
    source: "Ptrade东莞.md-设置函数（设计文档 §1.2 F8）"
    note: "回测昨日底仓导入；交易环境持仓以柜台为准（F8 账户数据 6 秒同步）"
  get_trades_file:
    signature: "get_trades_file()"
    backtest: true
    trading: false
    action: reject
    replacement: null
    pbox_version: "all"
    source: "Ptrade东莞.md-回测专用接口（设计文档 §5.2 P0）"
    note: "回测专用成交回报文件；交易环境无此文件语义，依赖即判不可转换（REJECT）"
  convert_position_from_csv:
    signature: "convert_position_from_csv(filename)"
    backtest: true
    trading: false
    action: reject
    replacement: null
    pbox_version: "all"
    source: "Ptrade东莞.md-回测专用接口（设计文档 §5.2 P0）"
    note: "回测专用持仓 CSV 导入；交易环境依赖该核心逻辑即判不可转换（REJECT）"

