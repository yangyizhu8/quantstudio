[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstudio"
version = "0.1.0"
description = "标准化数据管道 + 通用量化回测系统（双层校验 + 双轨回测引擎）"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "QuantStudio"}]
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "python-dateutil>=2.8",
    "pytz>=2023.3",
    "duckdb>=0.9.0",
    "filelock>=3.0",
    "fastjsonschema>=2.18",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 数据源（按需安装）
tushare = ["tushare>=1.2.89"]
baostock = ["baostock>=0.8.8"]
akshare = ["akshare>=1.10.0"]
# 数据库
questdb = ["questdb>=1.0.0"]
postgres = ["psycopg2-binary>=2.9"]
mysql = ["pymysql>=1.1.0"]
# GUI
gui = ["PyQt6>=6.5.0", "PyQt6-Fluent-Widgets>=1.11"]
qfluentwidgets = ["PyQt6-Fluent-Widgets>=1.11"]
# 全量
all = [
    "tushare>=1.2.89",
    "baostock>=0.8.8",
    "akshare>=1.10.0",
    "duckdb>=0.9.0",
    "PyQt6>=6.5.0",
    "PyQt6-Fluent-Widgets>=1.11",
]

[project.scripts]
quantstudio-daemon = "quantstudio.pipeline.daemon:main"
quantstudio-run = "quantstudio.engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantstudio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.package-data]
"quantstudio.backtest.libs" = ["bse_legacy_code_mapping.json"]
"quantstudio.strategy_compiler" = ["schemas/*.json", "examples/*.json"]
